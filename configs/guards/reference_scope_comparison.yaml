comparison_id: train_vs_all_clean_v4

empirical_support:
  features: [x, y, z, px, py, pz, E, t]
  rule: raw_observed_minmax
  weighting: unweighted_support
  scope_follows_reference_role: true
  interpretation: finite_sample_observed_envelope_not_physical_support
  train_action: diagnostic_only
  all_clean_action: operational_reject

robust_reference:
  weighting: original_fluka_weight
  transform_space: feature_specific
  iqr_multiplier: 3.0
  lower_quantile: 0.0001
  upper_quantile: 0.9999
  bound_rule: wider_of_weighted_iqr_fence_and_weighted_quantiles
  raw_minmax_used_for_robust_tail: false
  action: diagnostic_only

roles:
  train_ref:
    fit_scope: train
    selection_allowed: true
    usage: generated_validation
  all_ref:
    fit_scope: [train, validation, test]
    selection_allowed: false
    usage: frozen_production_and_muondis_only

comparison:
  use_same_generated_proposals: true
  report_row_fraction: true
  report_weighted_fraction: true
  report_per_feature_reasons: true
  report_rejection_overlap: true
