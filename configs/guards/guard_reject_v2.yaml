guard_id: guard_reject_v2
fit_split: train
policy:
  robust_mode: reject
  mass_shell_mode: reject
  scoring_plane_mode: reject
  physical_support_mode: reference_scope_raw_minmax
  maximum_rejection_fraction: 0.05

# Every dataset/year receives its own empirical hard support. The train-reference
# artifact is used for selection/test; the all-clean artifact is production-only.
hard_support_features: [x, y, z, px, py, pz, E, t]
hard_support_rule: raw_observed_minmax
z_constraint: train_fitted_scoring_plane_and_reference_scope_raw_minmax
robust_tail_action: diagnostic_only

reference_scope_policy:
  selection_guard: train_ref
  final_test_guard: train_ref
  frozen_production_guard: all_ref
  production_guard_selection_allowed: false
  comparison_config: configs/guards/reference_scope_comparison.yaml
